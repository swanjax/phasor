[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phasor"
version = "0.1.0"
description = "A Python library for simulating photonic circuits."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Sarthak Wanjari" }
]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "basedpyright>=1.31",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.basedpyright]
typeCheckingMode = "standard"
